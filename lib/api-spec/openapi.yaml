openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: home
    description: Data for the personal start page
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home/weather:
    get:
      operationId: getHomeWeather
      tags: [home]
      summary: Get current weather
      description: Returns current weather for the supplied coordinates
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Current weather
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeWeather"
        "502":
          description: Weather provider unavailable
  /home/news:
    get:
      operationId: getHomeNews
      tags: [home]
      summary: Get recent technology news
      description: Returns recent technology headlines
      responses:
        "200":
          description: Recent headlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsHeadline"
        "502":
          description: News provider unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    HomeWeather:
      type: object
      properties:
        temperatureC:
          type: number
        apparentTemperatureC:
          type: number
        humidityPercent:
          type: integer
        windSpeedKmh:
          type: number
        weatherCode:
          type: integer
        description:
          type: string
        timezone:
          type: string
        observedAt:
          type: string
      required:
        - temperatureC
        - apparentTemperatureC
        - humidityPercent
        - windSpeedKmh
        - weatherCode
        - description
        - timezone
        - observedAt
    NewsHeadline:
      type: object
      properties:
        title:
          type: string
        publisher:
          type: string
        publishedAt:
          type: ["string", "null"]
        url:
          type: string
      required:
        - title
        - publisher
        - publishedAt
        - url

